[flutter-dev]
image=ubuntu:24.04
additional_packages=curl wget git unzip xz-utils zip ca-certificates clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file qemu-kvm qemu-utils x11-utils pulseaudio zsh jq gnupg apt-transport-https mesa-utils chromium-browser
volume=flutter-dev-opt:/opt/dev
additional_flags=--device /dev/kvm
additional_flags=--device /dev/dri
init_hooks=bash $HOME/dotfiles/dev_env/flutter/init.sh
start_now=false
replace=true
entry=true
